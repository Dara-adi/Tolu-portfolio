<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Gallery — Light Mode</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="event-light-mode">

  <!-- Floating Back Button & Badge -->
  <nav class="gallery-nav-light">
    <a href="index.html" class="back-button-light">&larr; Back to Selected Works</a>
    <span class="gallery-badge">01 / Archives</span>
  </nav>

  <!-- Mini Editorial Photo Grid -->
  <main class="mini-gallery-container">
    <div class="gallery-grid">
      
  <div class="mini-card card-tilt-left video-card">
    <div class="card-inner">
        <video autoplay muted loop playsinline preload="auto">
            <source src="IMG_7500.mp4" type="video/mp4">
        </video>
    </div>
    <div class="card-footer">
        <span>01. Behind the Lens</span>
    </div>
</div>

<div class="mini-card card-tilt-right video-card">
    <div class="card-inner">
        <video autoplay muted loop playsinline preload="auto">
            <source src="IMG_7498.mp4" type="video/mp4">
        </video>
    </div>
    <div class="card-footer">
        <span>02. Set Life</span>
    </div>
</div>

      <div class="mini-card card-tilt-right">
        <div class="card-inner">
          <img src="IMG_7956.png" alt="Event Shot 3">
        </div>
        <div class="card-footer">
          <span>03. Focus</span>
        </div>
      </div>

      <div class="mini-card card-tilt-left">
        <div class="card-inner">
          <img src="IMG_7503.png" alt="Event Shot 4">
        </div>
        <div class="card-footer">
          <span>04. Wrap Up</span>
        </div>
      </div>

    </div>
  </main>

</body>
</html>
